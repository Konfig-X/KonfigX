name: Build KonfigX

on:
  workflow_dispatch:
    inputs:
      TEST_DWNL:
        description: 'Test samloader downloading'
        required: true
        default: 'no'
        type: choice
        options:
        - yes
        - no
      DEBUG:
        description: 'Set as debug build'
        required: true
        default: 'no'
        type: choice
        options:
        - yes
        - no

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      GIT_DBG: ${{ github.event.inputs.DEBUG }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event.inputs.TEST_DWNL == 'true' && fromJSON('["o1s"]') || fromJSON('["a34x","dm1q","o1s","p3s","r9s","t2s"]') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          ./scripts/build_dependencies.sh

      - name: Test samloader rq
        if: ${{ github.event.inputs.TEST_DWNL == 'true' }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-target -v S921BXXS9BYH2/S921BOXM9BYH2/S921BXXS9BYH2/S921BXXS9BYH2
          ./scripts/extract_fw.sh --ignore-target

      - name: Download source S24 stock
        if: ${{ endsWith(matrix.target, 'q') && github.event.inputs.TEST_DWNL != 'true' }} 
        run: |
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          ./scripts/download_fw.sh --ignore-target -v S921BXXS9BYH2/S921BOXM9BYH2/S921BXXS9BYH2/S921BXXS9BYH2

      - name: Download source S24 FE stock
        if: ${{ !endsWith(matrix.target, 'q') && github.event.inputs.TEST_DWNL != 'true' }} 
        run: |
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          ./scripts/download_fw.sh --ignore-target -v S721BXXS7BYH1/S721BOXM7BYH1/S721BXXS7BYH1/S721BXXS7BYH1

      - name: Download target stock
        if: ${{ github.event.inputs.TEST_DWNL != 'true' }}
        run: |
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          ./scripts/download_fw.sh --ignore-source

      - name: Extract stock firmwares
        if: ${{ github.event.inputs.TEST_DWNL != 'true' }}
        run: |
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          ./scripts/extract_fw.sh

      - name: Build ROM
        if: ${{ github.event.inputs.TEST_DWNL != 'true' }}
        run: |
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          ./scripts/make_rom.sh -z

      - name: Upload to GoFile
        if: ${{ github.event.inputs.TEST_DWNL != 'true' }}
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_ID }}" -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" "https://upload-eu-par.gofile.io/uploadFile")
          echo "Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'
