name: Build KonfigX

on:
  workflow_dispatch:
    inputs:
      TEST_DWNL:
        description: 'Test samloader downloading'
        required: true
        type: boolean
        default: false
      DEBUG:
        description: 'Set as debug build'
        required: true
        type: boolean
        default: false
      source_model_essi:
        description: 'Pinned source model for ESSI'
        required: true
        default: 'SM-S721B'
      source_csc_essi:
        description: 'Source CSC for ESSI'
        required: true
        default: 'EUX'
      source_url_essi:
        description: 'Source firmware URL for ESSI'
        required: true
        default: 'get from samfw.com'
      source_model_qssi:
        description: 'Pinned source model for QSSI'
        required: true
        default: 'SM-S921U'
      source_csc_qssi:
        description: 'Source CSC for QSSI'
        required: true
        default: 'XAA'
      source_url_qssi:
        description: 'Source firmware URL for QSSI'
        required: true
        default: 'get from samfw.com'
      source_triplet_essi:
        description: 'Source triplet for ESSI'
        required: true
        default: 'S721BXXSBCZC5/S721BOXMBCZC5/S721BXXSBCZC5'
      source_triplet_qssi:
        description: 'Source triplet for QSSI'
        required: true
        default: 'S921USQS5CZD2/S921UOYN5CZD2/S921USQS5CZD2'
      dm1q_url:
        description: 'dm1q 8.0 firmware url (ts the only snapd device we build sonion 🙏)'
        required: true
        default: 'get from samfw.com'
      a34x_url:
        description: 'a34x 8.0 firmware url (this thing shoulda died on 8.0)'
        required: true
        default: 'get from samfw.com'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      GIT_DBG: ${{ github.event.inputs.DEBUG }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event.inputs.TEST_DWNL == 'true' && fromJSON('["o1s"]') || fromJSON('["a34x","dm1q","o1s","p3s","r9s","t2s"]') }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/konfigx_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/konfigx_platform.x509.pem
          echo -n "${{ secrets.OTA_KEY_PK8 }}" | base64 --decode > security/konfigx_ota.pk8
          echo -n "${{ secrets.OTA_KEY_PEM }}" | base64 --decode > security/konfigx_ota.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          ./scripts/build_dependencies.sh

      - name: Test samloader rq
        if: ${{ github.event.inputs.TEST_DWNL == 'true' }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/download_fw.sh --ignore-target
          ./scripts/extract_fw.sh --ignore-target

      - name: Download stock ESSI/MSSI firmwares
        if: ${{ !endsWith(matrix.target, 'q') && github.event.inputs.TEST_DWNL != 'true' }}
        env:
          SRC_MODEL: ${{ github.event.inputs.source_model_essi }}
          SRC_CSC: ${{ github.event.inputs.source_csc_essi }}
          TRIPLET: ${{ github.event.inputs.source_triplet_essi }}
          URL: ${{ github.event.inputs.source_url_essi }}
          A34X_URL: ${{ github.event.inputs.a34x_url }}
        run: |
          set -eo pipefail
          FW_OUT_DIR="./out/odin/${SRC_MODEL}_${SRC_CSC}"
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          echo "- Processing ${SRC_MODEL} firmware with ${SRC_CSC} CSC"
          echo "    - Downloading ${TRIPLET}..."
          mkdir -p "$FW_OUT_DIR"
          wget -q --no-check-certificate --content-disposition "$URL" --directory-prefix="$FW_OUT_DIR"
          printf '%s\n' "$TRIPLET" > "$FW_OUT_DIR/.downloaded"
          ZIP_FILE="$(find "$FW_OUT_DIR" -name "*.zip" | sort -r | head -n 1)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo "No firmware ZIP found in $FW_OUT_DIR"
            exit 1
          fi
          echo "- Extracting $(basename "$ZIP_FILE")..."
          unzip -o "$ZIP_FILE" -d "$FW_OUT_DIR" && rm -rf "$ZIP_FILE"
          if [[ "${{ matrix.target }}" == "a34x" ]]; then
            echo "- Processing SM-A346B firmware with EUX CSC"
            echo "    - Downloading A346BXXSFEZC7/A346BOXMFEZC7/A346BXXSFEZC7..."
            mkdir -p ./out/odin/SM-A346B_EUX
            wget -q --no-check-certificate --content-disposition "$A34X_URL" --directory-prefix="./out/odin/SM-A346B_EUX"
            printf '%s\n' "A346BXXSFEZC7/A346BOXMFEZC7/A346BXXSFEZC7" > "./out/odin/SM-A346B_EUX/.downloaded"
            ZIP_FILE="$(find "out/odin/SM-A346B_EUX" -name "*.zip" | sort -r | head -n 1)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "No firmware ZIP found in out/odin/SM-A346B_EUX"
              exit 1
            fi
            echo "- Extracting $(basename "$ZIP_FILE")..."
            unzip -o "$ZIP_FILE" -d "out/odin/SM-A346B_EUX" && rm -rf "$ZIP_FILE"
          else
            ./scripts/download_fw.sh --ignore-source
          fi

      - name: Download stock QSSI firmwares
        if: ${{ endsWith(matrix.target, 'q') && github.event.inputs.TEST_DWNL != 'true' }}
        env:
          SRC_MODEL: ${{ github.event.inputs.source_model_qssi }}
          SRC_CSC: ${{ github.event.inputs.source_csc_qssi }}
          TRIPLET: ${{ github.event.inputs.source_triplet_qssi }}
          SRC_URL: ${{ github.event.inputs.source_url_qssi }}
          DM1Q_URL: ${{ github.event.inputs.dm1q_url }}
        run: |
          set -eo pipefail
          FW_OUT_DIR="./out/odin/${SRC_MODEL}_${SRC_CSC}"
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          echo "- Processing ${SRC_MODEL} firmware with ${SRC_CSC} CSC"
          echo "    - Downloading ${TRIPLET}..."
          mkdir -p "$FW_OUT_DIR"
          wget -q --no-check-certificate --content-disposition "$URL" --directory-prefix="$FW_OUT_DIR"
          printf '%s\n' "$TRIPLET" > "$FW_OUT_DIR/.downloaded"
          ZIP_FILE="$(find "$FW_OUT_DIR" -name "*.zip" | sort -r | head -n 1)"
          if [[ -z "$ZIP_FILE" ]]; then
            echo "No firmware ZIP found in $FW_OUT_DIR"
            exit 1
          fi
          echo "- Extracting $(basename "$ZIP_FILE")..."
          unzip -o "$ZIP_FILE" -d "$FW_OUT_DIR" && rm -rf "$ZIP_FILE"
          if [[ "${{ matrix.target }}" == "dm1q" ]]; then
            echo "- Processing SM-S911B firmware with EUX CSC"
            echo "    - Downloading S911BXXS9EZCI/S911BOXM9EZCI/S911BXXS9EZCI..."
            mkdir -p ./out/odin/SM-S911B_EUX
            wget -q --no-check-certificate --content-disposition "$DM1Q_URL" --directory-prefix="./out/odin/SM-S911B_EUX"
            printf '%s\n' "S911BXXS9EZCI/S911BOXM9EZCI/S911BXXS9EZCI" > "./out/odin/SM-S911B_EUX/.downloaded"
            ZIP_FILE="$(find "out/odin/SM-S911B_EUX" -name "*.zip" | sort -r | head -n 1)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "No firmware ZIP found in out/odin/SM-S911B_EUX"
              exit 1
            fi
            echo "- Extracting $(basename "$ZIP_FILE")..."
            unzip -o "$ZIP_FILE" -d "out/odin/SM-S911B_EUX" && rm -rf "$ZIP_FILE"
          else
            ./scripts/download_fw.sh --ignore-source
          fi
            
      - name: Extract stock firmwares
        if: ${{ github.event.inputs.TEST_DWNL != 'true' }}
        run: |
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          ./scripts/extract_fw.sh

      - name: Build ROM
        if: ${{ github.event.inputs.TEST_DWNL != 'true' }}
        run: |
          if [[ "$GIT_DBG" == "true" ]]; then
            source ./buildenv.sh --debug ${{ matrix.target }}
          else
            source ./buildenv.sh ${{ matrix.target }}
          fi
          ./scripts/make_rom.sh -z

      - name: Upload to GoFile
        if: ${{ github.event.inputs.TEST_DWNL != 'true' }}
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_ID }}" -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" "https://upload-eu-par.gofile.io/uploadFile")
          echo "Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'
